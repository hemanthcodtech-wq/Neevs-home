<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b57d0"/>
      <stop offset="100%" stop-color="#072347"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="96" height="96" x="2" y="2" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Home Roof Peak with Chimney in Orange Accent -->
  <path d="M50 14 L82 40 L74 40 L74 30 L66 30 L66 46 L50 33 L26 52 L18 42 Z" fill="url(#orangeGrad)"/>
  
  <!-- Stylized House Walls / Appliance Shield in Royal Blue -->
  <path d="M25 46 L50 26 L75 46 L75 78 C75 82 71 86 67 86 L33 86 C29 86 25 82 25 78 Z" fill="none" stroke="url(#blueGrad)" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Dynamic Service Wrench Across the Center in Vibrant Orange -->
  <path d="M38 68 L60 46 C62 44 65 44 67 46 C69 48 69 51 67 53 L45 75 C43 77 40 77 38 75 C36 73 36 70 38 68 Z" fill="url(#orangeGrad)"/>
  <circle cx="63.5" cy="49.5" r="3" fill="#ffffff"/>
  
  <!-- Center Letter 'N' Motif for NEEVS -->
  <path d="M36 50 L36 76 M36 50 L64 76 M64 50 L64 76" stroke="url(#blueGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
